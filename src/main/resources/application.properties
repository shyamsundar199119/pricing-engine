spring.application.name=pricingengine
logging.level.eu.moonpark=INFO


# M1: price per started minute
pricing.m1.price-per-hour=60

# M2: price per started hour
pricing.m2.weekday-price-per-hour=100
pricing.m2.weekend-price-per-hour=200

# M3: price per started minute
pricing.m3.price-per-minute-daytime=2
pricing.m3.price-per-minute-outside-daytime=3

# M3: free parking period during daytime, in minutes
pricing.m3.free-minutes=60

# M3: daytime boundaries
pricing.m3.daytime-start=08
pricing.m3.daytime-end=16